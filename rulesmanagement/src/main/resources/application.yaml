# This is the single, correct configuration file.

spring:
  # H2 Database Configuration
  h2:
    console:
      enabled: true
      path: /h2-console

  # Datasource Connection Settings
  datasource:
    url: jdbc:h2:mem:rulesdb
    driverClassName: org.h2.Driver
    username: sa
    password: password

  # JPA/Hibernate Configuration (ALL JPA settings go here)
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    # VERY IMPORTANT: 'none' tells Hibernate not to touch the schema.
    # Spring Boot will run your schema.sql and data.sql files instead.
    hibernate:
      ddl-auto: none
    # Show SQL statements in the console for debugging
    show-sql: true
    properties:
      hibernate:
        format_sql: true # Pretty-print the SQL

  # SQL Initialization Configuration
  sql:
    init:
      # This ensures schema.sql and data.sql are always run for H2
      mode: always

# Configuration for OpenAPI / Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
